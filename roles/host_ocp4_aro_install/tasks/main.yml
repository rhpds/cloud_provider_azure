---
- name: Install and configure ARO
  block:
  - name: Validate ARO input
    ansible.builtin.assert:
      that:
      - hostvars.localhost.azure_settings.version | length > 0
      - hostvars.localhost.azure_settings.worker_count | int >= 3
  - name: Install Azure CLI on bastion
    ansible.builtin.include_role:
      name: agnosticd.cloud_provider_azure.install_cli
  - name: Create or reconnect to ARO cluster
    block:
    - name: Provision ARO using protected credentials
      agnosticd.cloud_provider_azure.azure_environment:
        action: aro_install
        auth: "{{ hostvars.localhost.azure_auth }}"
        settings: "{{ hostvars.localhost.azure_settings | combine({'pull_secret': ocp4_pull_secret | default('')}) }}"
        config_dir: "/home/{{ ansible_user }}/.azure-agnosticd"
        project: "{{ project_tag }}"
      register: azure_aro_result
      async: 7500
      poll: 30
      no_log: true
    rescue:
    - name: Report non-secret ARO preflight diagnostics
      vars:
        _diagnostic: "{{ azure_aro_result.diagnostic | default({}) }}"
        _settings: "{{ hostvars.localhost.azure_settings }}"
      ansible.builtin.fail:
        msg: >-
          ARO provisioning failed in {{ _settings.region }}.
          Control-plane size={{ _settings.master_size }}, worker size={{ _settings.worker_size }}.
          {% if _diagnostic.kind | default('') == 'sku' %}
          Unavailable {{ _diagnostic.setting }}: {{ _diagnostic.reasons | join('; ') }}.
          {% elif _diagnostic.kind | default('') == 'quota' %}
          Insufficient {{ _diagnostic.family }} core quota:
          required={{ _diagnostic.required }}, available={{ _diagnostic.available }} (including bootstrap allowance).
          {% else %}
          The protected provisioning operation failed; no credential-bearing output is displayed.
          {% endif %}
  - name: Install OpenShift client
    ansible.builtin.include_role:
      name: host_ocp4_installer
      tasks_from: install_installer.yml
    vars:
      host_ocp4_installer_version: "{{ hostvars.localhost.azure_settings.version }}"
  - name: Create cluster authentication directory
    ansible.builtin.file:
      path: "/home/{{ ansible_user }}/{{ cluster_name }}/auth"
      state: directory
      mode: '0700'
  - name: Log into ARO
    ansible.builtin.command:
      argv:
      - oc
      - login
      - "{{ azure_aro_result.cluster.apiserverProfile.url }}"
      - --username
      - "{{ azure_aro_result.credentials.kubeadminUsername }}"
      - "--password={{ azure_aro_result.credentials.kubeadminPassword }}"
      - "--kubeconfig=/home/{{ ansible_user }}/{{ cluster_name }}/auth/kubeconfig"
    register: azure_aro_login
    until: azure_aro_login is succeeded
    retries: 30
    delay: 20
    changed_when: false
    no_log: true
  - name: Store kubeadmin password
    ansible.builtin.copy:
      content: "{{ azure_aro_result.credentials.kubeadminPassword }}"
      dest: "/home/{{ ansible_user }}/{{ cluster_name }}/auth/kubeadmin-password"
      mode: '0600'
    no_log: true
  - name: Protect kubeconfig
    ansible.builtin.file:
      path: "/home/{{ ansible_user }}/{{ cluster_name }}/auth/kubeconfig"
      mode: '0600'
  - name: Export cluster access to controller
    ansible.builtin.fetch:
      src: "/home/{{ ansible_user }}/{{ cluster_name }}/auth/{{ item }}"
      dest: "{{ hostvars.localhost.output_dir }}/{{ config }}_{{ guid }}_{{ item }}"
      flat: true
    loop: [kubeconfig, kubeadmin-password]
    no_log: true
  - name: Create bastion kubeconfig directory
    ansible.builtin.file:
      path: "/home/{{ ansible_user }}/.kube"
      state: directory
      mode: '0700'
  - name: Protect controller credentials
    delegate_to: localhost
    ansible.builtin.file:
      path: "{{ output_dir }}/{{ config }}_{{ guid }}_{{ item }}"
      mode: '0600'
    loop: [kubeconfig, kubeadmin-password]
  - name: Configure bastion user access
    ansible.builtin.copy:
      src: "/home/{{ ansible_user }}/{{ cluster_name }}/auth/kubeconfig"
      dest: "/home/{{ ansible_user }}/.kube/config"
      remote_src: true
      mode: '0600'
  - name: Publish standard OpenShift access information
    ansible.builtin.include_role:
      name: host_ocp4_installer_info
  - name: Configure student cluster access
    when: bastion_setup_student_user | default(false) | bool
    become: true
    block:
    - name: Create student kubeconfig directory
      ansible.builtin.file:
        path: "/home/{{ bastion_student_user_name }}/.kube"
        state: directory
        owner: "{{ bastion_student_user_name }}"
        mode: '0700'
    - name: Copy student kubeconfig
      ansible.builtin.copy:
        src: "/home/{{ ansible_user }}/{{ cluster_name }}/auth/kubeconfig"
        dest: "/home/{{ bastion_student_user_name }}/.kube/config"
        remote_src: true
        owner: "{{ bastion_student_user_name }}"
        mode: '0600'

  always:
  - name: Remove Azure CLI session from bastion
    ansible.builtin.file:
      path: "/home/{{ ansible_user }}/.azure-agnosticd"
      state: absent
