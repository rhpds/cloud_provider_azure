---

- name: Install and configure ARO
  block:

  - name: Validate ARO input
    ansible.builtin.assert:
      that:
      - hostvars.localhost.azure_settings.version | length > 0
      - hostvars.localhost.azure_settings.worker_count | int >= (2 if hostvars.localhost.azure_settings.hcp | default(false) else 3)

  - name: Install Azure CLI on bastion
    ansible.builtin.include_role:
      name: agnosticd.cloud_provider_azure.install_cli

  - name: Create or reconnect to ARO cluster
    block:

    - name: Provision ARO using protected credentials
      agnosticd.cloud_provider_azure.azure_environment:
        template: >-
          {{ lookup('ansible.builtin.file', role_path ~ '/templates/hcp.json') | from_json
             if hostvars.localhost.azure_settings.hcp | default(false) else {} }}
        action: aro_install
        auth: "{{ hostvars.localhost.azure_auth }}"
        settings: "{{ hostvars.localhost.azure_settings | combine({'pull_secret': ocp4_pull_secret | default('')}) }}"
        config_dir: "/home/{{ ansible_user }}/.azure-agnosticd"
        project: "{{ project_tag }}"
      register: azure_aro_result
      async: 7500
      poll: 30
      no_log: true
    rescue:

    - name: Report non-secret ARO preflight diagnostics
      vars:
        _diagnostic: "{{ azure_aro_result.diagnostic | default({}) }}"
        _settings: "{{ hostvars.localhost.azure_settings }}"
      ansible.builtin.fail:
        msg: >-
          ARO provisioning failed in {{ _settings.region }}.
          {% if _settings.hcp | default(false) %}
          Hosted control planes, worker size={{ _settings.worker_size }}.
          {% else %}
          Control-plane size={{ _settings.master_size }}, worker size={{ _settings.worker_size }}.
          {% endif %}
          {% if _diagnostic.kind | default('') == 'sku' %}
          Unavailable {{ _diagnostic.setting }}: {{ _diagnostic.reasons | join('; ') }}.
          {% elif _diagnostic.kind | default('') == 'quota' %}
          Insufficient {{ _diagnostic.family }} core quota:
          required={{ _diagnostic.required }}, available={{ _diagnostic.available }}
          ({{ 'worker surge and minimum HCP allowance' if _settings.hcp | default(false) else 'including bootstrap allowance' }}).
          {% elif _diagnostic.kind | default('') == 'version' %}
          HCP release {{ _diagnostic.version }} is unavailable in this region; select an advertised release.
          {% else %}
          The protected provisioning operation failed; no credential-bearing output is displayed.
          {% endif %}

  - name: Install OpenShift client
    ansible.builtin.include_tasks: install_client.yml

  - name: Configure HCP administrative access
    when: hostvars.localhost.azure_settings.hcp | default(false)
    ansible.builtin.include_role:
      name: agnosticd.cloud_provider_azure.host_ocp4_aro_hcp_credentials

  - name: Configure classic ARO access
    when: not (hostvars.localhost.azure_settings.hcp | default(false))
    ansible.builtin.include_tasks: classic_access.yml

  always:

  - name: Remove Azure CLI session from bastion
    ansible.builtin.file:
      path: "/home/{{ ansible_user }}/.azure-agnosticd"
      state: absent
