---

- name: Configure the additional ARO HCP pull secret
  delegate_to: localhost
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ output_dir }}/{{ config }}_{{ guid }}_kubeconfig"
  block:

  - name: Read the existing additional pull secret
    kubernetes.core.k8s_info:
      api_version: v1
      kind: Secret
      name: additional-pull-secret
      namespace: kube-system
    register: _aro_hcp_pull_secret
    no_log: true

  - name: Merge registry credentials into the additional pull secret
    vars:
      _aro_hcp_pull_secret_current: "{{ _aro_hcp_pull_secret.resources | first | default({}) }}"
      _aro_hcp_registry_config_current: >-
        {{ _aro_hcp_pull_secret_current.data['.dockerconfigjson'] | default('e30=') | b64decode | from_json }}
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: additional-pull-secret
          namespace: kube-system
          resourceVersion: "{{ _aro_hcp_pull_secret_current.metadata.resourceVersion | default(omit) }}"
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: >-
            {{ _aro_hcp_registry_config_current
               | combine(_aro_registry_config, {'auths': _aro_hcp_registry_config_current.auths | default({})
                 | combine(_aro_registry_config.auths)})
               | to_json(sort_keys=true) | b64encode }}
    no_log: true

  rescue:

  - name: Report the ARO HCP pull secret failure
    ansible.builtin.fail:
      msg: >-
        Could not configure the ARO HCP additional-pull-secret in kube-system.
        Check that the administrative kubeconfig can read and write this Secret and rerun provisioning.
