# project_tag (string): exact agnosticd_project tag on the owned infrastructure.
project_tag: "{{ undef(hint='Supply the deployment project_tag') }}"
# azure_result (mapping): registered provision result with changed and vms fields.
azure_result: "{{ undef(hint='Internal bastion provisioning result') }}"
