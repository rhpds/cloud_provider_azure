---
- name: Run Azure inventory
  agnosticd.cloud_provider_azure.azure_environment:
    action: inventory
    auth: "{{ hostvars.localhost.azure_auth }}"
    settings: "{{ hostvars.localhost.azure_settings }}"
    config_dir: "{{ hostvars.localhost.azure_cli_config_dir }}"
    project: "{{ project_tag }}"
  register: azure_result

- name: Add bastion to inventory
  ansible.builtin.add_host:
    name: "{{ item.name }}"
    groups: [bastions]
    # Match the Host entry generated by infra_common_ssh_config_generate so SSH selects its provision key.
    ansible_host: "{{ item.name }}"
    public_ip_address: "{{ item.publicIps }}"
    public_dns_name: "bastion.{{ azure_settings.dns_zone }}"
    private_ip_address: "{{ item.privateIps }}"
    ansible_user: "{{ azure_bastion_user | default('azure') }}"
    cloud_user: "{{ azure_bastion_user | default('azure') }}"
    instance_canonical_name: bastion
    shortname: bastion
    isolated: false
  loop: "{{ azure_result.vms }}"
