---
# Inputs generated by initialize on the controller. This role creates/verifies
# the IPI cluster group; it does not install OpenShift or write bastion secrets.
# azure_auth (secret mapping): normalized sandbox authentication.
azure_auth: "{{ undef(hint='Run initialize before installer_prepare') }}"
# azure_settings (mapping): cluster group, region and all ownership boundaries.
azure_settings: "{{ undef(hint='Run initialize before installer_prepare') }}"
# azure_cli_config_dir (path): private controller Azure CLI session directory.
azure_cli_config_dir: "{{ undef(hint='Run initialize before installer_prepare') }}"
# project_tag (string): agnosticd_project tag required on an existing group and
# written to a new group. Never point this role at the sandbox resource group.
project_tag: "{{ undef(hint='Supply the deployment project_tag') }}"
