---
# Remove the worker role from control-plane nodes, disable master scheduling and
# optionally drain control-plane nodes so workloads move to the dedicated workers.

- name: Get control-plane nodes
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    label_selectors:
    - node-role.kubernetes.io/control-plane
  register: r_control_plane_nodes

- name: Build list of control-plane nodes with worker label
  ansible.builtin.set_fact:
    control_plane_worker_nodes: >-
      {%- set result = [] -%}
      {%- for node in r_control_plane_nodes.resources -%}
        {%- if 'node-role.kubernetes.io/worker' in node.metadata.labels -%}
          {%- set _ = result.append(node.metadata.name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}

- name: Display control-plane nodes with worker label
  ansible.builtin.debug:
    msg: "Control-plane nodes with worker label: {{ control_plane_worker_nodes }}"

- name: Remove worker label from control-plane nodes
  kubernetes.core.k8s:
    api_version: v1
    kind: Node
    name: "{{ item }}"
    state: present
    definition:
      metadata:
        labels:
          node-role.kubernetes.io/worker: null
  loop: "{{ control_plane_worker_nodes }}"

- name: Set mastersSchedulable to false
  kubernetes.core.k8s:
    api_version: config.openshift.io/v1
    kind: Scheduler
    name: cluster
    state: present
    definition:
      spec:
        mastersSchedulable: false

- name: Drain and uncordon control-plane nodes
  when:
  - worker_drain_control_plane | bool
  - control_plane_worker_nodes | length > 0
  block:
  - name: Drain control-plane node
    kubernetes.core.k8s_drain:
      name: "{{ item }}"
      state: drain
      delete_options:
        ignore_daemonsets: true
        delete_emptydir_data: true
        force: true
    loop: "{{ control_plane_worker_nodes }}"
    register: r_drain
    # A drain stops at pods protected by a PodDisruptionBudget, such as the
    # kube-apiserver guard pods. That is expected on control-plane nodes, so
    # the error is ignored and reported in the summary below.
    ignore_errors: true

  - name: Uncordon control-plane node
    kubernetes.core.k8s_drain:
      name: "{{ item }}"
      state: uncordon
    loop: "{{ control_plane_worker_nodes }}"

- name: Display worker-only mode configuration results
  ansible.builtin.debug:
    msg:
    - "Worker-only mode configured"
    - "Control-plane nodes with worker label removed: {{ control_plane_worker_nodes }}"
    - "mastersSchedulable: false"
    - >-
      Control-plane nodes fully drained:
      {{ r_drain.results | default([]) | map(attribute='item') | list
         | difference(r_drain.results | default([]) | selectattr('failed', 'defined')
           | selectattr('failed') | map(attribute='item') | list)
         if worker_drain_control_plane | bool else 'drain skipped' }}
    - >-
      Control-plane nodes partly drained (pods kept by a disruption budget):
      {{ r_drain.results | default([]) | selectattr('failed', 'defined')
         | selectattr('failed') | map(attribute='item') | list
         if worker_drain_control_plane | bool else 'drain skipped' }}
