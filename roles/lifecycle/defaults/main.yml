---
# ACTION (string): global v2 run action. Required unless azure_lifecycle_action
# is explicitly supplied. Never override ACTION merely to start a destroy job's
# bastion: other roles still need to see ACTION=destroy.
ACTION: "{{ undef(hint='Supply the global ACTION or an explicit azure_lifecycle_action') }}"
# azure_lifecycle_action (string): start, stop or status. Defaults to ACTION.
# During destroy preparation set this to start while leaving ACTION=destroy.
# For ARO only the bastion is powered; cluster state is reported without powering
# Azure-managed VMs. Self-managed IPI VM power operations include its cluster.
azure_lifecycle_action: "{{ ACTION }}"

# Runtime context passed to initialize; see that role's defaults for credentials,
# ownership settings and optional ARO inputs. These are required v2 variables.
# output_dir (absolute path): archive directory and destination of status.txt.
output_dir: "{{ undef(hint='Supply the existing controller output_dir') }}"
# project_tag (string): original deployment's exact agnosticd_project tag.
project_tag: "{{ undef(hint='Supply the original deployment project_tag') }}"
# Generated on localhost by the included initialize role. Do not override.
# azure_auth is secret; azure_settings contains non-secret ownership settings.
azure_auth: "{{ undef(hint='Generated by the included initialize role') }}"
azure_settings: "{{ undef(hint='Generated by the included initialize role') }}"
# azure_cli_config_dir (path): private az state directory generated by initialize.
azure_cli_config_dir: "{{ undef(hint='Generated by the included initialize role') }}"
# azure_lifecycle_result (mapping): registered module result containing changed,
# vms and cluster. Saved as JSON in <output_dir>/status.txt with mode 0600.
azure_lifecycle_result: "{{ undef(hint='Internal lifecycle module result') }}"
