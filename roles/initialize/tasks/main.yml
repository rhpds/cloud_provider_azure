---
- name: Validate deployment inputs
  ansible.builtin.assert:
    that:
    - guid is defined and guid != 'notset'
    - host_ocp4_deploy_installation_method | default('openshift_install') in ['aro', 'openshift_install']
    - aro_identity_mode in ['managed_identity', 'service_principal']
    fail_msg: A valid guid and a supported installation method and identity mode are required

- name: Validate nested sandbox payload when supplied
  when: azure_sandbox is defined
  ansible.builtin.assert:
    that:
    - azure_sandbox is mapping
    - azure_sandbox.credentials | default([]) | length == 1
    - azure_sandbox.credentials[0] is mapping
    fail_msg: azure_sandbox must contain exactly one complete credentials mapping
  no_log: true

- name: Normalize nested sandbox authentication
  when: azure_sandbox is defined
  ansible.builtin.set_fact:
    azure_auth: >-
      {{ azure_sandbox.credentials[0] | dict2items
         | selectattr('key', 'in', ['subscription_id', 'app_id', 'password', 'tenant', 'resource_group', 'azure_region'])
         | items2dict }}
  no_log: true

- name: Normalize flattened sandbox authentication
  when: azure_sandbox is not defined
  ansible.builtin.set_fact:
    azure_auth:
      subscription_id: "{{ azure_subscription | default(azure_subscription_id | default('')) }}"
      app_id: "{{ azure_service_principal_id | default('') }}"
      password: "{{ azure_service_principal_password | default('') }}"
      tenant: "{{ azure_tenant | default(azure_tenant_id | default('')) }}"
      resource_group: "{{ azure_resource_group | default('') }}"
      azure_region: "{{ azure_region | default('') }}"
  no_log: true

- name: Validate required Azure credential fields
  ansible.builtin.assert:
    that:
    - azure_auth[item] | default(none) is string
    - azure_auth[item] | default('') | length > 0
    fail_msg: "Missing Azure credential field {{ item }}; provide a complete azure_sandbox payload or the flattened Azure variables"
  loop: [subscription_id, app_id, password, tenant, resource_group, azure_region]

- name: Set provider settings
  ansible.builtin.set_fact:
    azure_region: "{{ azure_auth.azure_region }}"
    azure_subscription: "{{ azure_auth.subscription_id }}"
    azure_subscription_id: "{{ azure_auth.subscription_id }}"
    azure_service_principal_id: "{{ azure_auth.app_id }}"
    azure_service_principal: "{{ azure_auth.app_id }}"
    azure_service_principal_password: "{{ azure_auth.password }}"
    azure_password: "{{ azure_auth.password }}"
    azure_tenant: "{{ azure_auth.tenant }}"
    az_dnszone_resource_group: "{{ azure_auth.resource_group }}"
    azure_cli_config_dir: "{{ output_dir }}/.azure-{{ config }}-{{ guid }}"
    azure_settings:
      sandbox_group: "{{ azure_auth.resource_group }}"
      region: "{{ azure_auth.azure_region }}"
      infra_group: "{{ azure_infra_resource_group }}"
      cluster_group: "{{ azure_cluster_resource_group }}"
      cluster_name: "{{ aro_cluster_name }}"
      dns_zone: "{{ azure_dns_zone }}"
      method: "{{ host_ocp4_deploy_installation_method | default('openshift_install') }}"
      hcp: "{{ aro_deploy_hcp | bool }}"
      identity_mode: "{{ aro_identity_mode }}"
      version: "{{ aro_version }}"
      master_size: "{{ aro_master_vm_size }}"
      worker_size: "{{ aro_worker_vm_size }}"
      worker_count: "{{ aro_worker_count | int }}"
      worker_disk: "{{ aro_worker_disk_size | int }}"
      vnet_cidr: "{{ aro_vnet_cidr }}"
      master_cidr: "{{ aro_master_subnet_cidr }}"
      worker_cidr: "{{ aro_worker_subnet_cidr }}"
      pod_cidr: "{{ aro_pod_cidr }}"
      service_cidr: "{{ aro_service_cidr }}"
  no_log: true

- name: Add HCP settings to the ownership contract
  when: aro_deploy_hcp | bool
  ansible.builtin.set_fact:
    azure_settings: >-
      {{ azure_settings | combine({'hcp_nodepool': aro_hcp_nodepool_name, 'hcp_zone': aro_hcp_availability_zone,
         'hcp_integration_cidr': aro_hcp_vnet_integration_subnet_cidr,
         'hcp_vault_name': 'hcp-' ~ ((azure_auth.subscription_id ~ '/' ~ project_tag) | hash('sha256'))[:20]}) }}

- name: Locate archived ownership record
  ansible.builtin.stat:
    path: "{{ output_dir }}/{{ config }}_{{ guid }}_azure_ownership.json"
  register: azure_ownership_stat

- name: Load archived ownership record
  when: azure_ownership_stat.stat.exists
  ansible.builtin.slurp:
    src: "{{ output_dir }}/{{ config }}_{{ guid }}_azure_ownership.json"
  register: azure_ownership_slurp

- name: Validate archived ownership
  when: azure_ownership_stat.stat.exists
  vars:
    saved: "{{ azure_ownership_slurp.content | b64decode | from_json }}"
  ansible.builtin.assert:
    that:
    - saved.subscription_id == azure_auth.subscription_id
    - saved.project == project_tag
    - >-
      (saved.settings | combine({'hcp': saved.settings.hcp | default(false)})
       | dict2items | rejectattr('key', 'in', ['master_size', 'worker_size', 'region']) | items2dict) ==
      (azure_settings | dict2items | rejectattr('key', 'in', ['master_size', 'worker_size', 'region']) | items2dict)
    - saved.settings.region == azure_settings.region or ACTION | default('provision') == 'provision'
    fail_msg: |-
      Deployment settings differ from archived ownership. Restore the original inputs for lifecycle/destroy jobs.
      {% if saved.subscription_id != azure_auth.subscription_id %}
      azure_subscription: archived={{ saved.subscription_id | to_json }}, requested={{ azure_auth.subscription_id | to_json }}
      {% endif %}
      {% if saved.project != project_tag %}
      project_tag: archived={{ saved.project | to_json }}, requested={{ project_tag | to_json }}
      {% endif %}
      {% for field, variable in {
        'hcp': 'aro_deploy_hcp', 'sandbox_group': 'azure_resource_group', 'region': 'azure_region',
        'hcp_nodepool': 'aro_hcp_nodepool_name', 'hcp_zone': 'aro_hcp_availability_zone',
        'hcp_integration_cidr': 'aro_hcp_vnet_integration_subnet_cidr',
        'infra_group': 'azure_infra_resource_group', 'cluster_group': 'azure_cluster_resource_group',
        'cluster_name': 'aro_cluster_name', 'dns_zone': 'azure_dns_zone',
        'method': 'host_ocp4_deploy_installation_method', 'identity_mode': 'aro_identity_mode',
        'version': 'aro_version', 'worker_count': 'aro_worker_count', 'worker_disk': 'aro_worker_disk_size',
        'vnet_cidr': 'aro_vnet_cidr', 'master_cidr': 'aro_master_subnet_cidr',
        'worker_cidr': 'aro_worker_subnet_cidr', 'pod_cidr': 'aro_pod_cidr', 'service_cidr': 'aro_service_cidr'
      }.items() %}
      {% if saved.settings.get(field) != azure_settings.get(field) %}
      {{ variable }}: archived={{ saved.settings.get(field) | to_json }}, requested={{ azure_settings.get(field) | to_json }}
      {% endif %}
      {% endfor %}
      A provisioning run can change region only after verifying that all deployment resource groups are absent.

- name: Verify deployment groups are absent before accepting a changed region
  when:
  - azure_ownership_stat.stat.exists
  - saved.settings.region != azure_settings.region
  vars:
    saved: "{{ azure_ownership_slurp.content | b64decode | from_json }}"
  agnosticd.cloud_provider_azure.azure_environment:
    action: check_region_change
    auth: "{{ azure_auth }}"
    settings: "{{ azure_settings }}"
    config_dir: "{{ azure_cli_config_dir }}"
    project: "{{ project_tag }}"

- name: Preserve recorded ARO node sizes for lifecycle and destroy operations
  when:
  - azure_ownership_stat.stat.exists
  - ACTION | default('provision') != 'provision' or azure_settings.method != 'aro'
  vars:
    saved: "{{ azure_ownership_slurp.content | b64decode | from_json }}"
  ansible.builtin.set_fact:
    azure_settings: "{{ azure_settings | combine({'master_size': saved.settings.master_size, 'worker_size': saved.settings.worker_size}) }}"

- name: Verify ARO does not exist before accepting changed node sizes
  when:
  - azure_ownership_stat.stat.exists
  - azure_settings.method == 'aro'
  - ACTION | default('provision') == 'provision'
  - saved.settings.master_size != azure_settings.master_size or saved.settings.worker_size != azure_settings.worker_size
  vars:
    saved: "{{ azure_ownership_slurp.content | b64decode | from_json }}"
  agnosticd.cloud_provider_azure.azure_environment:
    action: aro_check_sizes
    auth: "{{ azure_auth }}"
    settings: "{{ azure_settings }}"
    config_dir: "{{ azure_cli_config_dir }}"
    project: "{{ project_tag }}"

- name: Permit HCP vault recovery only with matching archived ownership
  when: aro_deploy_hcp | bool
  ansible.builtin.set_fact:
    azure_settings: "{{ azure_settings | combine({'hcp_recover_vault': azure_ownership_stat.stat.exists}) }}"

- name: Verify sandbox resource group and delegated zone
  agnosticd.cloud_provider_azure.azure_environment:
    action: validate
    auth: "{{ azure_auth }}"
    settings: "{{ azure_settings }}"
    config_dir: "{{ azure_cli_config_dir }}"
    project: "{{ project_tag }}"

- name: Record ownership boundaries for later lifecycle and destroy jobs
  ansible.builtin.copy:
    content: >-
      {{ {'subscription_id': azure_auth.subscription_id, 'project': project_tag,
          'settings': azure_settings | dict2items | rejectattr('key', 'equalto', 'hcp_recover_vault') | items2dict,
          'resource_group_ids': [
            '/subscriptions/' ~ azure_auth.subscription_id ~ '/resourceGroups/' ~ azure_settings.infra_group,
            '/subscriptions/' ~ azure_auth.subscription_id ~ '/resourceGroups/' ~ azure_settings.cluster_group,
            '/subscriptions/' ~ azure_auth.subscription_id ~ '/resourceGroups/' ~ azure_settings.cluster_group ~ '-managed'],
          'dns_record': {'zone': azure_settings.dns_zone, 'group': azure_settings.sandbox_group, 'name': 'bastion', 'type': 'A'}
         } | to_nice_json }}
    dest: "{{ output_dir }}/{{ config }}_{{ guid }}_azure_ownership.json"
    mode: '0600'
